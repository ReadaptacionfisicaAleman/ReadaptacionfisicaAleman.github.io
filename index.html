<title>Agenda Alemán</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}[hidden]{display:none!important}img{max-width:100%}
/* Layout: petrol hero band (date, next appointment, week) → timeline of the day on gray ground; fixed bottom bar with 3 tabs + center add button; forms are bottom sheets built from tappable chips. */
:root{
  --bg:#E8ECED; --surface:#FFFFFF; --ink:#132025; --muted:#5C696E; --line:#D2D9DB;
  --petrol:#0B5566; --deep:#073A46; --on-deep:#EAF4F5; --on-deep-2:#9FC6CE; --soft:#D8E9ED; --on-petrol:#FFFFFF;
  --ok:#0E8F67; --ok-soft:#D9F2E8; --bad:#C2364E; --bad-soft:#F9E1E6; --warn:#A85E14; --warn-soft:#FBEBD6;
  --f-display:"Bricolage Grotesque","Arial Narrow",Arial,sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --nav-h:68px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1416; --surface:#182024; --ink:#E7EDEE; --muted:#97A5AA; --line:#28343A;
  --petrol:#5DB3C4; --deep:#0A2D35; --on-deep:#E6F3F5; --on-deep-2:#86B9C3; --soft:#14323A; --on-petrol:#08262D;
  --ok:#3CCF9C; --ok-soft:#11302A; --bad:#F27A8D; --bad-soft:#3A1D25; --warn:#EFA45A; --warn-soft:#33261A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1416; --surface:#182024; --ink:#E7EDEE; --muted:#97A5AA; --line:#28343A;
  --petrol:#5DB3C4; --deep:#0A2D35; --on-deep:#E6F3F5; --on-deep-2:#86B9C3; --soft:#14323A; --on-petrol:#08262D;
  --ok:#3CCF9C; --ok-soft:#11302A; --bad:#F27A8D; --bad-soft:#3A1D25; --warn:#EFA45A; --warn-soft:#33261A; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--deep)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--petrol);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* hero */
.hero{background:var(--deep);color:var(--on-deep);border-radius:0 0 28px 28px}
.hero .wrap{padding-block:16px 20px;display:flex;flex-direction:column;gap:16px}
.tag{margin:-10px 0 0;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--on-deep-2);font-weight:600}
.motto{margin:18px 0 0;text-align:center;font-family:var(--f-display);font-weight:700;font-size:17px;color:var(--muted);text-wrap:balance}
.brandrow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mark{font-family:var(--f-display);font-weight:800;font-stretch:80%;font-size:15px;letter-spacing:.18em;text-transform:uppercase}
.mark span{color:var(--on-deep-2);font-weight:500;letter-spacing:.12em}
.hbtn{border:1px solid color-mix(in srgb,var(--on-deep) 28%,transparent);background:transparent;color:var(--on-deep);border-radius:999px;height:36px;min-width:36px;padding:0 14px;font-weight:600;font-size:13px}
.bigdate{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.bigdate h1{margin:0;font-family:var(--f-display);font-weight:800;font-size:clamp(44px,13vw,72px);line-height:.88;letter-spacing:-.03em}
.bigdate h1 small{display:block;font-size:.34em;font-weight:500;letter-spacing:0;color:var(--on-deep-2);text-transform:capitalize;margin-top:8px}
.navs{display:flex;gap:6px}
.next{display:flex;align-items:center;gap:12px;background:color-mix(in srgb,var(--on-deep) 9%,transparent);border-radius:18px;padding:12px 14px;border:0;color:inherit;text-align:left;width:100%}
.next .t{font-family:var(--f-mono);font-weight:700;font-size:20px;background:var(--on-deep);color:var(--deep);border-radius:12px;padding:6px 10px;font-variant-numeric:tabular-nums}
.next small{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--on-deep-2);font-weight:600}
.next b{display:block;font-size:16px;overflow-wrap:anywhere}
.next .m{min-width:0}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.wd{border:0;background:transparent;color:var(--on-deep);border-radius:14px;padding:8px 0;display:flex;flex-direction:column;align-items:center;gap:3px}
.wd small{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--on-deep-2)}
.wd strong{font-family:var(--f-display);font-weight:700;font-size:20px;line-height:1}
.wd i{width:6px;height:6px;border-radius:50%;background:transparent}
.wd i.has{background:var(--on-deep-2)}
.wd.today strong{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:2px}
.wd[aria-pressed="true"]{background:var(--on-deep);color:var(--deep)}
.wd[aria-pressed="true"] small{color:var(--deep)}
.wd[aria-pressed="true"] i.has{background:var(--deep)}

main{padding-block:18px calc(var(--nav-h) + 40px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.status{color:var(--muted);text-align:center;padding:40px 8px}
.banner{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;background:var(--warn-soft);border-radius:16px;padding:12px 14px;font-size:14px}
.banner b{color:var(--warn)}
.sum{display:flex;gap:8px;flex-wrap:wrap}
.sum span{background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--muted)}
.sum b{color:var(--ink);font-variant-numeric:tabular-nums}

/* timeline */
.tl{display:flex;flex-direction:column}
.slot{display:grid;grid-template-columns:62px minmax(0,1fr);gap:12px;position:relative;padding-bottom:12px}
.slot::before{content:"";position:absolute;left:30px;top:34px;bottom:-2px;border-left:2px dotted var(--line)}
.slot:last-child::before{display:none}
.hr{font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1;letter-spacing:-.02em;padding-top:6px;text-align:center;font-variant-numeric:tabular-nums}
.hr small{display:block;font-family:var(--f-mono);font-size:11px;font-weight:500;color:var(--muted);margin-top:5px;letter-spacing:0}
.c{background:var(--surface);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.c.off{opacity:.55}
.c-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;border:0;background:none;padding:0;text-align:left;width:100%;color:inherit}
.c-top .who{min-width:0}
.c-top b{display:block;font-family:var(--f-display);font-weight:700;font-size:19px;line-height:1.15;overflow-wrap:anywhere}
.c-top span.tipo{font-size:13px;color:var(--muted)}
.edit{flex:none;font-size:12px;font-weight:600;color:var(--petrol);padding-top:3px}
.pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;margin-top:6px}
.st-programada,.st-confirmada{background:var(--soft);color:var(--petrol)}
.st-asistio{background:var(--ok-soft);color:var(--ok)}
.st-no_asistio,.st-cancelada{background:var(--bad-soft);color:var(--bad)}
.big2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tog{border:1.5px solid var(--line);background:transparent;border-radius:14px;min-height:46px;padding:8px 10px;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px;font-variant-numeric:tabular-nums}
.tog.on{background:var(--ok);border-color:var(--ok);color:var(--surface)}

function resumenPac(p){const cs=S.citas.filter(c=>c.pacienteId===p.id),h=cs.filter(c=>c.estado==="asistio").length,hoy=ymd(new Date()),ag=cs.filter(c=>c.estado!=="asistio"&&c.estado!=="cancelada"&&c.estado!=="no_asistio"&&c.fecha>=hoy).length,pag=cs.filter(c=>c.pagado).reduce((a,c)=>a+(+c.valor||0),0);

function calStart(max,sel,month){S.cal={max,sel:[...new Set(sel.filter(Boolean))].slice(0,max),month:month||((sel[0]||ymd(new Date())).slice(0,7))};drawCal()}
function calMax(n){if(!S.cal)return calStart(n,[]);S.cal.max=n;S.cal.sel=[...S.cal.sel].sort().slice(0,n);drawCal()}
function drawCal(){const el=$("#cal");if(!el||!S.cal)return;const {month,sel,max}=S.cal,f=pd(month+"-01"),lead=(f.getDay()+6)%7,dim=new Date(f.getFullYear(),f.getMonth()+1,0).getDate(),hoy=ymd(new Date()),ord=[...sel].sort();
  let g=["L","M","M","J","V","S","D"].map(d=>`<small>${d}</small>`).join("")+"<span></span>".repeat(lead);
  for(let d=1;d<=dim;d++){const k=month+"-"+String(d).padStart(2,"0"),on=sel.includes(k),busy=S.citas.some(c=>c.fecha===k&&c.estado!=="cancelada");
    g+=`<button type="button" class="cd${on?" on":""}${k<hoy?" past":""}${k===hoy?" today":""}${busy&&!on?" busy":""}" data-calday="${k}" aria-pressed="${on}" aria-label="${esc(longDate(k))}">${d}${on?`<i>${ord.indexOf(k)+1}</i>`:""}</button>`}
  el.innerHTML=`<div class="cal"><div class="calh"><button type="button" class="x" data-calnav="-1" aria-label="Mes anterior">‹</button><b>${esc((m=>m.charAt(0).toUpperCase()+m.slice(1))(monthName(month)))}</b><button type="button" class="x" data-calnav="1" aria-label="Mes siguiente">›</button></div><div class="calg">${g}</div></div>`;
  const sm=$("#cal-sum");if(sm)sm.textContent=sel.length?`${sel.length} de ${max} fecha${max===1?"":"s"}: `+ord.map(k=>DIAS[pd(k).getDay()]+" "+shortDate(k)).join(" · "):`Toca ${max===1?"la fecha":"las fechas (hasta "+max+")"} en el calendario. El punto gris indica que ese día ya hay citas.`}
function calFields(hora){return `<div class="fld"><span class="lab">Toca la fecha de cada sesión</span><div id="cal"></div><p class="info" id="cal-sum"></p></div><div class="fld"><label for="s-hora">Hora</label><input id="s-hora" type="time" step="900" value="${esc(hora)}"></div><div class="fld"><span class="lab">Duración</span>${chipGroup("sdur",DUR.map(n=>[n,n+" min"]),60)}</div>`}
const nSel=()=>+(($("#s-otro")||{}).value)||+pick("nses")||1;
function svcField(name,val){const extra=[...new Set([...S.citas.map(c=>c.tipo),...S.planes.map(x=>x.servicio)].filter(t=>t&&!SERVICIOS.includes(t)))].sort((a,b)=>a.localeCompare(b,"es"));
  if(val&&!SERVICIOS.includes(val)&&!extra.includes(val))extra.push(val);
  return chipGroup(name,[...SERVICIOS,...extra].map(t=>[t,t]).concat([["__otro","+ Otro servicio"]]),val).replace('class="chips"','class="chips sv"')+`<input id="${name}-otxt" maxlength="60" placeholder="Escribe el nombre del servicio" autocomplete="off" hidden style="margin-top:6px">`}
function getSvc(name){const v=pick(name);if(v!=="__otro")return v;const t=(($("#"+name+"-otxt")||{}).value||"").trim().replace(/\s+/g," ");return t?t.charAt(0).toUpperCase()+t.slice(1):""}
function edad(f){if(!f)return null;const n=pd(f),h=new Date();if(isNaN(n)||n>h)return null;let a=h.getFullYear()-n.getFullYear();const m=h.getMonth()-n.getMonth();if(m<0||(m===0&&h.getDate()<n.getDate()))a--;
  if(a<2){let ms=(h.getFullYear()-n.getFullYear())*12+h.getMonth()-n.getMonth();if(h.getDate()<n.getDate())ms--;return ms+(ms===1?" mes":" meses")}return a+" años"}

/* ---------- datos: Supabase o modo de prueba ---------- */
const CFG=window.ALEMAN_CONFIG||{};
const DEMO=!(CFG.supabaseUrl&&CFG.supabaseKey);
const COLS={pacientes:["nombre","documento","telefono","correo","notas","dias","fechaNac","autorizaDatos","autorizaFecha"],
 planes:["pacienteId","servicio","sesiones","estado"],
 citas:["pacienteId","pacienteNombre","fecha","hora","duracion","tipo","estado","valor","pagado","metodo","notas","serie","planId","sesionN","actualizado"]};
const toCamel=k=>k.replace(/_([a-z])/g,(_,c)=>c.toUpperCase()),toSnake=k=>k.replace(/[A-Z]/g,c=>"_"+c.toLowerCase());
const mapK=(o,f)=>Object.fromEntries(Object.entries(o).map(([k,v])=>[f(k),v]));
const clean=(t,o)=>Object.fromEntries(Object.entries(o).filter(([k,v])=>COLS[t].includes(k)&&v!==undefined));
const uid=()=>(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2));
let sb=null;
const DB=DEMO?(()=>{
  const K="aleman-demo";const load=()=>{try{return JSON.parse(localStorage.getItem(K))||{}}catch(_){return {}}};
  const st=Object.assign({pacientes:[],citas:[],planes:[],fichas:{},notas:[]},load());const save=()=>{try{localStorage.setItem(K,JSON.stringify(st))}catch(_){}};
  return{
    async list(t){return st[t].map(r=>({...r}))},
    async insert(t,o){const rows=(Array.isArray(o)?o:[o]).map(x=>({id:uid(),creado:new Date().toISOString(),...clean(t,x)}));st[t].push(...rows);save();return rows},
    async update(t,id,patch){const r=st[t].find(x=>x.id===id);if(r)Object.assign(r,clean(t,patch));save()},
    async remove(t,id){st[t]=st[t].filter(x=>x.id!==id);if(t==="pacientes"){st.citas=st.citas.filter(c=>c.pacienteId!==id);st.planes=st.planes.filter(x=>x.pacienteId!==id);delete st.fichas[id];st.notas=st.notas.filter(n=>n.pacienteId!==id)}save()},
    async getFicha(pid){return st.fichas[pid]||null},
    async saveFicha(pid,d){st.fichas[pid]={...d,pacienteId:pid,ts:new Date().toISOString()};save()},
    async listNotas(pid){return st.notas.filter(n=>n.pacienteId===pid).sort((a,b)=>b.ts.localeCompare(a.ts))},
    async addNota(pid,texto){st.notas.push({id:uid(),pacienteId:pid,texto,ts:new Date().toISOString()});save()},
    async delNota(id){st.notas=st.notas.filter(n=>n.id!==id);save()}
  }})():(()=>{
  sb=supabase.createClient(CFG.supabaseUrl,CFG.supabaseKey);
  const ok=({data,error})=>{if(error)throw error;return data};
  return{
    async list(t){return ok(await sb.from(t).select("*")).map(r=>mapK(r,toCamel))},
    async insert(t,o){const rows=(Array.isArray(o)?o:[o]).map(x=>mapK(clean(t,x),toSnake));return ok(await sb.from(t).insert(rows).select()).map(r=>mapK(r,toCamel))},
    async update(t,id,patch){ok(await sb.from(t).update(mapK(clean(t,patch),toSnake)).eq("id",id))},
    async remove(t,id){ok(await sb.from(t).delete().eq("id",id))},
    async getFicha(pid){const d=ok(await sb.from("fichas").select("*").eq("paciente_id",pid).maybeSingle());return d?mapK(d,toCamel):null},
    async saveFicha(pid,d){ok(await sb.from("fichas").upsert({paciente_id:pid,motivo:d.motivo,antecedentes:d.antecedentes,objetivo:d.objetivo,plan:d.plan,ts:new Date().toISOString()},{onConflict:"paciente_id"}))},
    async listNotas(pid){return ok(await sb.from("notas_sesion").select("*").eq("paciente_id",pid).order("ts",{ascending:false})).map(r=>mapK(r,toCamel))},
    async addNota(pid,texto){ok(await sb.from("notas_sesion").insert({paciente_id:pid,texto}))},
    async delNota(id){ok(await sb.from("notas_sesion").delete().eq("id",id))}
  }})();

function hero(inner){return `<header class="hero"><div class="wrap"><div class="brandrow"><span class="mark">Alemán <span>· Readaptación física</span></span>${!DEMO&&!S.login&&!S.mustChange?`<span style="display:flex;gap:6px"><button class="hbtn" type="button" data-pwd>Contraseña</button><button class="hbtn" type="button" data-logout>Salir</button></span>`:""}</div><p class="tag">Estudio · Planificación · Metodología · Readaptación · Rendimiento</p>${inner}</div></header>`}

function vAgenda(banner){
  const hoy=ymd(new Date()),d=pd(S.day),dow=(d.getDay()+6)%7,mon=addDays(S.day,-dow);
  let week="";
  for(let i=0;i<7;i++){const k=addDays(mon,i),n=S.citas.some(c=>c.fecha===k&&c.estado!=="cancelada");
    week+=`<button type="button" class="wd${k===hoy?" today":""}" data-day="${k}" aria-pressed="${k===S.day}" aria-label="${esc(longDate(k))}"><small>${DIAS[pd(k).getDay()]}</small><strong>${pd(k).getDate()}</strong><i class="${n?"has":""}"></i></button>`}
  const list=S.citas.filter(c=>c.fecha===S.day).sort((a,b)=>mins(a.hora)-mins(b.hora));
  const act=list.filter(c=>c.estado!=="cancelada");
  // next appointment: today/upcoming from now, else first active of selected day
  const nowKey=hoy+" "+nowHM();
  const nxt=S.citas.filter(c=>c.estado!=="cancelada"&&c.estado!=="asistio"&&c.estado!=="no_asistio"&&(c.fecha+" "+c.hora)>=nowKey).sort((a,b)=>(a.fecha+a.hora).localeCompare(b.fecha+b.hora))[0];
  const nxtHtml=nxt?`<button type="button" class="next" data-edit="${nxt.id}"><span class="t">${esc(nxt.hora)}</span><span class="m"><small>Próxima cita${nxt.fecha!==hoy?" · "+esc(shortDate(nxt.fecha)):""}</small><b>${esc(nombreDe(nxt))}</b></span></button>`:`<div class="next"><span class="m"><small>Próxima cita</small><b>No hay citas pendientes</b></span></div>`;
  const title=S.day===hoy?"Hoy":S.day===addDays(hoy,1)?"Mañana":S.day===addDays(hoy,-1)?"Ayer":DIAS[d.getDay()]+" "+d.getDate();
  const h=hero(`<div class="bigdate"><h1>${title}<small>${esc(longDate(S.day))}</small></h1><div class="navs"><button class="hbtn" type="button" data-shift="-7" aria-label="Semana anterior">‹</button>${S.day!==hoy?`<button class="hbtn" type="button" data-day="${hoy}">Hoy</button>`:""}<button class="hbtn" type="button" data-shift="7" aria-label="Semana siguiente">›</button></div></div><div class="week">${week}</div>${nxtHtml}`);
  const asis=list.filter(c=>c.estado==="asistio").length,cob=list.filter(c=>c.pagado).reduce((s,c)=>s+(+c.valor||0),0);
  let tl="",nowShown=S.day!==hoy;const nm=mins(nowHM());
  for(const c of list){if(!nowShown&&mins(c.hora)>nm){tl+=`<div class="now">Ahora ${nowHM()}</div>`;nowShown=true}tl+=slot(c)}
  if(!nowShown&&list.length)tl+=`<div class="now">Ahora ${nowHM()}</div>`;
  const body=list.length?`<div class="sum"><span><b>${act.length}</b> ${act.length===1?"cita":"citas"}</span><span><b>${asis}</b> asistieron</span><span><b>${cop(cob)}</b> cobrado</span></div><div class="tl">${tl}</div>`
    :`<div class="empty"><strong>Día libre</strong>No hay citas para este día.${S.canWrite?`<br><button class="btn primary" type="button" data-new>Agendar una cita</button>`:""}</div>`;
  return h+`<main class="wrap">${banner}${body}</main>`;
}
function slot(c){

  const msg=`Hola ${nombreDe(c).split(" ")[0]}, te recordamos tu cita en Alemán Readaptación Física el ${longDate(c.fecha)} a las ${c.hora}. ¡Te esperamos!`;
  const wa=p&&p.telefono?waLink(p.telefono,msg):"";
  const ctl=S.canWrite&&c.estado!=="cancelada"?`<div class="big2"><button type="button" class="tog${c.estado==="asistio"?" on":""}" data-q="asis" data-id="${c.id}" aria-pressed="${c.estado==="asistio"}">${c.estado==="asistio"?"✓ Asistió":"¿Asistió?"}</button><button type="button" class="tog${c.pagado?" on":""}" data-q="pago" data-id="${c.id}" aria-pressed="${!!c.pagado}">${c.pagado?"✓ Pagó":"Cobrar"}${+c.valor?" "+cop(c.valor):""}</button></div>`:"";
  return `<div class="slot"><div class="hr">${esc(c.hora)}<small>${esc(c.duracion||60)}′</small></div>
  <article class="c${off?" off":""}"><button type="button" class="c-top" data-edit="${c.id}"><span class="who"><b>${esc(nombreDe(c))}</b><span class="tipo">${esc(c.tipo)} · hasta ${endTime(c.hora,c.duracion)}</span>${(()=>{const t=nTerapia(c);return t&&c.estado!=="cancelada"&&c.estado!=="no_asistio"?`<br><span class="tn">Sesión ${t.n}${t.total?" de "+t.total:""}${t.total&&t.n>t.total?" · fuera del plan":""}</span>`:""})()}<br><span class="pill st-${c.estado}">${ESTADOS[c.estado]||c.estado}</span></span><span class="edit">Editar</span></button>${ctl}${(()=>{const l=(wa?`<a class="lnk" href="${wa}" target="_blank" rel="noopener">Recordatorio por WhatsApp →</a>`:"")+(S.canHC&&c.pacienteId?`<button type="button" class="lnk" data-hc="${c.pacienteId}">Notas →</button>`:"");return l?`<div class="links">${l}</div>`:""})()}</article></div>`;
}

function vPacientes(banner){
  const q=S.q.trim().toLowerCase();

function vResumen(banner){
  const cs=S.citas.filter(c=>(c.fecha||"").startsWith(S.month));
  const asis=cs.filter(c=>c.estado==="asistio"),falt=cs.filter(c=>c.estado==="no_asistio"),canc=cs.filter(c=>c.estado==="cancelada");
  const cob=cs.filter(c=>c.pagado).reduce((s,c)=>s+(+c.valor||0),0);
  const pend=cs.filter(c=>!c.pagado&&c.estado==="asistio"),pendT=pend.reduce((s,c)=>s+(+c.valor||0),0);
  const cerr=asis.length+falt.length,tasa=cerr?Math.round(asis.length/cerr*100):0;
  const porTipo={};cs.filter(c=>c.estado!=="cancelada").forEach(c=>{porTipo[c.tipo]=(porTipo[c.tipo]||0)+1});
  const maxT=Math.max(1,...Object.values(porTipo));
  const bars=Object.entries(porTipo).sort((a,b)=>b[1]-a[1]).map(([t,n])=>`<div class="bar"><span>${esc(t)}</span><span class="n">${n}</span><div class="track"><i style="width:${n/maxT*100}%"></i></div></div>`).join("")||`<p class="muted">Sin citas este mes.</p>`;
  const porM={};cs.filter(c=>c.pagado).forEach(c=>{const k=c.metodo||"Sin medio";porM[k]=(porM[k]||0)+(+c.valor||0)});
  const mrows=Object.entries(porM).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="lrow"><span>${esc(k)}</span><b>${cop(v)}</b></div>`).join("")||`<p class="muted">Aún no hay pagos.</p>`;
  const prows=pend.sort((a,b)=>a.fecha.localeCompare(b.fecha)).map(c=>`<div class="lrow"><span>${esc(nombreDe(c))} · ${esc(shortDate(c.fecha))}</span><b>${cop(c.valor)}</b></div>`).join("")||`<p class="muted">Todo al día.</p>`;
  const h=hero(`<div class="bigdate"><h1 style="text-transform:capitalize">${esc(monthName(S.month).split(" ")[0])}<small>${S.month.slice(0,4)}</small></h1><div class="navs"><button class="hbtn" type="button" data-mshift="-1" aria-label="Mes anterior">‹</button><button class="hbtn" type="button" data-mshift="1" aria-label="Mes siguiente">›</button></div></div><div><div class="lbl">Cobrado en el mes</div><div class="money">${cop(cob)}</div></div>`);
  return h+`<main class="wrap">${banner}<div class="kpis"><div class="kpi"><small>Por cobrar</small><b>${cop(pendT)}</b><span>${pend.length} sesiones</span></div><div class="kpi"><small>Citas</small><b>${cs.length-canc.length}</b><span>${canc.length} canceladas</span></div><div class="kpi"><small>Asistencia</small><b>${cerr?tasa+"%":"—"}</b><span>${falt.length} faltaron</span></div></div>
  <section class="panel"><h3>Pendientes por cobrar</h3>${prows}</section>
  <section class="panel"><h3>Citas por tipo</h3>${bars}</section>
  <section class="panel"><h3>Por medio de pago</h3>${mrows}</section></main>`;
}

async function hcAction(kind,btn){
  const pid=sheet.dataset.id,box=$("#hcAp");
  if(kind==="edit"){box.dataset.editing="1";box.innerHTML=fichaForm(S.ficha||{});return}
  if(kind==="cancel"){renderAp(S.ficha);return}
  if(kind==="del"){if(!btn.dataset.arm){btn.dataset.arm="1";btn.textContent="¿Seguro?";setTimeout(()=>{if(btn.isConnected){delete btn.dataset.arm;btn.textContent="Borrar"}},3500);return}
    try{await DB.delNota(btn.dataset.hcdel);await loadHC(pid);toast("Nota borrada")}catch(e){fail(e)}return}
  btn.disabled=true;
  try{
    if(kind==="open"){
      const data={};HCF.forEach(([k])=>data[k]=$("#h-"+k).value.trim());
      if(!Object.values(data).some(Boolean)){toast("Escribe al menos un campo");return}
      await DB.saveFicha(pid,data);await loadHC(pid);toast("Ficha guardada");

async function saveCita(){
  const nuevo=!sheet.dataset.id&&pick("pmode")==="nuevo";let p=nuevo?null:pac(sheet.dataset.pid);
  const nNom=nuevo?$("#n-nombre").value.trim().replace(/\s+/g," "):"",nDoc=nuevo?$("#n-doc").value.trim():"";
  if(nuevo){if(!nNom){$("#n-nombre").focus();toast("Escribe el nombre del paciente");return}
    if($("#n-nac").value&&!edad($("#n-nac").value)){toast("Revisa la fecha de nacimiento");return}
    const dup=S.pacientes.find(x=>(x.nombre||"").toLowerCase()===nNom.toLowerCase()||(nDoc&&x.documento===nDoc));
    if(dup){showAlert("Ya existe ese paciente",`${dup.nombre}${dup.documento?" (CC "+dup.documento+")":""} ya está registrado. Elige “Paciente existente” y búscalo.`);return}}
  else if(!p){$("#f-buscar")&&$("#f-buscar").focus();toast("Busca y elige el paciente");return}
  if(!$("#f-fecha").value||!$("#f-hora").value){toast("Falta el día o la hora");return}
  if(!getSvc("tipo")){if(pick("tipo")==="__otro"){$("#tipo-otxt").focus();toast("Escribe el nombre del servicio")}else toast("Elige el servicio");return}
  const nMulti=$("#multiBox")&&!$("#multiBox").hidden?nSel():1,rep=nMulti>1,dates=rep?[...S.cal.sel].sort():[$("#f-fecha").value];
  if(rep&&!dates.length){toast("Toca al menos una fecha en el calendario");return}
  {const hh=$("#f-hora").value,du=+pick("dur")||60;for(const d of dates){const hit=clashAt(d,hh,du,sheet.dataset.id);if(hit){checkClash();blocked(hit);return}}}
  if(nuevo){const [np]=await DB.insert("pacientes",{nombre:nNom,documento:nDoc,telefono:$("#n-tel").value.trim(),correo:$("#n-mail").value.trim(),fechaNac:$("#n-nac").value||null,notas:"",dias:[],autorizaDatos:false});p={id:np.id,nombre:nNom}}
  const id=sheet.dataset.id,old=id?S.citas.find(c=>c.id===id):{};
  const pagado=$("#f-pagado").checked;
  const body={pacienteId:p.id,pacienteNombre:p.nombre,fecha:$("#f-fecha").value,hora:$("#f-hora").value,duracion:+pick("dur")||60,tipo:getSvc("tipo"),estado:id?(pick("estado")||old.estado):"programada",valor:+$("#f-valor").value||0,pagado,metodo:pagado?pick("metodo"):"",notas:$("#f-notas").value.trim(),creado:old.creado||new Date().toISOString(),actualizado:new Date().toISOString()};
  let assign=[];
  if(id){body.planId=old.planId||null;body.sesionN=old.sesionN||null}
  else if(sheet.dataset.plan){assign=[[sheet.dataset.plan,+sheet.dataset.ses]]}
  else if(rep){const [pl]=await DB.insert("planes",{pacienteId:p.id,servicio:body.tipo,sesiones:nMulti,estado:"activo"});assign=dates.map((d,i)=>[pl.id,i+1])}
  else{const pl=planesDe(p.id).find(x=>x.servicio===body.tipo&&planStat(x).sin>0);if(pl)assign=planStat(pl).sl.filter(x=>!x.c).map(x=>[pl.id,x.n])}
  if(id){await DB.update("citas",id,body);await renumber(body.planId)}
  else{const serie=rep?"s"+Date.now().toString(36):null;await DB.insert("citas",dates.map((d,i)=>({...body,fecha:d,serie,planId:assign[i]?assign[i][0]:null,sesionN:assign[i]?assign[i][1]:null})));if(assign[0])await renumber(assign[0][0])}
  const msg=id?"Cita actualizada":rep?`${dates.length} de ${nMulti} sesiones agendadas`:"Cita agendada";
  if(S.back||(rep&&dates.length<nMulti)){const b=S.back||p.id;S.back=null;await refresh();openPac(b);toast(msg);return}
  S.day=dates[0];S.tab="agenda";dlg.close();await refresh();toast(msg);
}
async function savePac(){
  const nombre=$("#p-nombre").value.trim().replace(/\s+/g," ");
  if(!nombre){$("#p-nombre").focus();toast("Escribe el nombre");return}
  const id=sheet.dataset.id,old=id?pac(id):{};
  const auth=$("#p-auth").checked;if($("#p-nac").value&&!edad($("#p-nac").value)){toast("Revisa la fecha de nacimiento");return}
  const body={nombre,fechaNac:$("#p-nac").value||null,documento:$("#p-doc").value.trim(),telefono:$("#p-tel").value.trim(),correo:$("#p-mail").value.trim(),notas:$("#p-notas").value.trim(),dias:pickAll("pdias").map(Number),autorizaDatos:auth,autorizaFecha:auth?(old.autorizaFecha||new Date().toISOString()):null,creado:old.creado||new Date().toISOString()};
  let sv="",n=0;if(!id){if(pick("svc")==="__otro"&&!getSvc("svc")){$("#svc-otxt").focus();toast("Escribe el nombre del servicio");return}sv=getSvc("svc");n=+($("#s-otro").value)||+pick("nses");if(sv&&!n){toast("Elige el número de sesiones");return}if(n&&!sv){toast("Elige el servicio");return}}
  if(id){await DB.update("pacientes",id,body);dlg.close();await refresh();toast("Paciente actualizado");return}
  const [np]=await DB.insert("pacientes",body);
  if(sv&&n)await DB.insert("planes",{pacienteId:np.id,servicio:sv,sesiones:n,estado:"activo"});
  await refresh();openPac(np.id);toast(sv?"Paciente creado. Ahora agenda sus sesiones":"Paciente creado");
}

function openProg(plId){const pl=S.planes.find(x=>x.id===plId);if(!pl)return;const p=pac(pl.pacienteId);const st=planStat(pl);stopHC();
  const used=S.citas.filter(c=>c.planId===pl.id).sort((a,b)=>(a.fecha+a.hora).localeCompare(b.fecha+b.hora)),last=used[used.length-1];

  <div class="sf"><button type="button" class="btn ghost" data-pacback="${pl.pacienteId}">Volver</button><button type="submit" class="btn primary">Agendar sesiones</button></div>`;

async function renumber(plId){if(!plId)return;await refresh();const cs=S.citas.filter(c=>c.planId===plId&&c.estado!=="cancelada"&&c.estado!=="no_asistio").sort((a,b)=>(a.fecha+a.hora).localeCompare(b.fecha+b.hora));
  for(let i=0;i<cs.length;i++)if(+cs[i].sesionN!==i+1)await DB.update("citas",cs[i].id,{sesionN:i+1})}
async function makeCitas(pl,p,ks){const ds=[...(S.cal?S.cal.sel:[])].sort();if(!ds.length)return 0;
  const hora=$("#s-hora").value||"08:00",dur=+pick("sdur")||60,now=new Date().toISOString();
  for(const d of ds){const hit=clashAt(d,hora,dur,null);if(hit){blocked(hit);return -1}}
  await DB.insert("citas",ds.map((d,i)=>({pacienteId:p.id,pacienteNombre:p.nombre,fecha:d,hora,duracion:dur,tipo:pl.servicio,estado:"programada",valor:0,pagado:false,metodo:"",notas:"",planId:pl.id,sesionN:ks[i],actualizado:now})));return ds.length}
async function saveSvc(){const pid=sheet.dataset.id,p=pac(pid);if(pick("svc")==="__otro"&&!getSvc("svc")){$("#svc-otxt").focus();toast("Escribe el nombre del servicio");return}const sv=getSvc("svc"),n=+($("#s-otro").value)||+pick("nses");
  if(!sv){toast("Elige el servicio");return}if(!n||n<1||n>60){toast("Elige el número de sesiones");return}
  if(S.cal&&S.cal.sel.length){const hh=$("#s-hora").value||"08:00",du=+pick("sdur")||60;for(const d of S.cal.sel){const hit=clashAt(d,hh,du,null);if(hit){blocked(hit);return}}}
  const [pl]=await DB.insert("planes",{pacienteId:pid,servicio:sv,sesiones:n,estado:"activo"});
  const k=await makeCitas(pl,p,Array.from({length:n},(_,i)=>i+1));await renumber(pl.id);
  await refresh();openPac(pid);toast(k?`Servicio agregado: ${k} de ${n} sesiones agendadas`:"Servicio agregado. Agenda sus sesiones cuando quieras")}
async function saveProg(){const pl=S.planes.find(x=>x.id===sheet.dataset.id),p=pac(pl.pacienteId),ks=planStat(pl).sl.filter(x=>!x.c).map(x=>x.n);
  const k=await makeCitas(pl,p,ks);if(k===-1)return;if(k)await renumber(pl.id);if(!k){toast("Toca al menos una fecha en el calendario");return}await refresh();openPac(p.id);toast(k===1?"Sesión agendada":k+" sesiones agendadas")}
async function toggleAsis(c){const patch={estado:c.estado==="asistio"?"programada":"asistio",actualizado:new Date().toISOString()};
  const pl=c.planId&&S.planes.find(x=>x.id===c.planId),st=pl&&planStat(pl),fin=patch.estado==="asistio"&&st&&st.faltan===1;
  await DB.update("citas",c.id,patch);await refresh();
  return patch.estado==="asistio"?(fin?`¡Completó sus ${pl.sesiones} sesiones de ${pl.servicio}!`:"Marcada como asistida"):"Asistencia quitada"}
function fail(e){console.error(e);if(e&&(e.status===401||/JWT|session/i.test(e.message||""))){toast("Tu sesión venció. Ingresa de nuevo.");S.login=true;if(dlg.open)dlg.close();render();return}toast("No se pudo guardar. Revisa la conexión e intenta de nuevo.")}

    const plId=pd_.dataset.plandel,pid=sheet.dataset.id;try{for(const c of S.citas.filter(x=>x.planId===plId)){if(c.estado==="asistio")await DB.update("citas",c.id,{planId:null,sesionN:null});else await DB.remove("citas",c.id)}await DB.remove("planes",plId);await refresh();openPac(pid);toast("Servicio quitado")}catch(err){fail(err)}return}
